name: Build and publish site

# Every push to main rebuilds dist/ and publishes it to the `deploy` branch.
# Hostinger (hPanel > Websites > Advanced > Git) deploys the `deploy` branch into public_html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: pip install -r requirements.txt

      - name: Build English and Hindi pages
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python3 build.py

      - name: Publish dist/ to the deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
